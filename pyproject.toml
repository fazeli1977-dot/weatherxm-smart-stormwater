[project]
name = "weatherxm-smart-stormwater"
version = "0.1.0"
description = "DePIN-Powered Urban Stormwater Infrastructure & Real-Time Runoff Risk Advisory"
readme = "README.md"
authors = [{ name = "Alireza Sani", email = "alirezafazeli@live.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "plotly>=7.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "streamlit>=1.65.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
wxm-stormwater = "weatherxm_smart_stormwater.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherxm_smart_stormwater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

